<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 64" width="264" height="64" fill="none" role="img" aria-label="PreExam!">
  <defs>
    <linearGradient id="pe-logo-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="52%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <radialGradient id="pe-logo-sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(18 12) rotate(48) scale(44)">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="pe-logo-rim" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.38" />
    </linearGradient>

    <linearGradient id="pe-logo-gold" x1="38" y1="10" x2="54" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="48%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ffcc00" />
    </linearGradient>

    <linearGradient id="pe-word-accent" x1="138" y1="14" x2="236" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="pe-bang-accent" x1="238" y1="14" x2="252" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#e21b3c" />
    </linearGradient>

    <filter id="pe-logo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#fde047" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Emblem mark -->
  <g>
    <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#pe-logo-bg)" />
    <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#pe-logo-sheen)" />
    <path
      d="M32 9.5H43.5C49.3 9.5 54 14.2 54 20V32.5C54 44.2 44.6 51.8 32 54.8C19.4 51.8 10 44.2 10 32.5V20C10 14.2 14.7 9.5 20.5 9.5H32Z"
      stroke="#ffffff"
      stroke-opacity="0.16"
      stroke-width="1.25"
    />
    <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="15.25" stroke="url(#pe-logo-rim)" stroke-width="1.5" />
    <path
      d="M35.91 16.86A17.5 17.5 0 1 0 47.14 28.09"
      stroke="#ffffff"
      stroke-width="3.2"
      stroke-linecap="round"
    />
    <path
      d="M35.98 22.27A12.5 12.5 0 1 0 41.73 28.02"
      stroke="#ffffff"
      stroke-opacity="0.34"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-dasharray="2.4 2.8"
    />
    <path d="M30.5 23.5L42 29.5L30.5 35.5L19 29.5L30.5 23.5Z" fill="#ffffff" />
    <path
      d="M24.2 33.6V38.5C24.2 40.9 27 42.8 30.5 42.8C34 42.8 36.8 40.9 36.8 38.5V33.6L30.5 36.9L24.2 33.6Z"
      fill="#ffffff"
      fill-opacity="0.94"
    />
    <path d="M21 30.6V37.4" stroke="#fde047" stroke-width="1.75" stroke-linecap="round" />
    <circle cx="21" cy="38.7" r="1.65" fill="#ffcc00" />
    <circle cx="30.5" cy="29.5" r="2.1" fill="#fde047" />
    <circle cx="30.5" cy="29.5" r="0.85" fill="#ffffff" />
    <path
      d="M46.5 9.7Q48.2 15.8 54.3 17.5Q48.2 19.2 46.5 25.3Q44.8 19.2 38.7 17.5Q44.8 15.8 46.5 9.7Z"
      fill="url(#pe-logo-gold)"
      filter="url(#pe-logo-glow)"
    />
  </g>

  <!-- Horizontal Logotype -->
  <text
    x="76"
    y="44"
    font-family="'Nunito', 'Sarabun', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="36"
    font-weight="900"
    letter-spacing="-1.1"
    fill="#1e1b4b"
  >
    Pre<tspan fill="url(#pe-word-accent)">Exam</tspan><tspan fill="url(#pe-bang-accent)">!</tspan>
  </text>
</svg>
